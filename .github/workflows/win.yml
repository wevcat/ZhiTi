name: only win

# 触发方式：
#  1) 推送 v* 形式的标签（推荐），例如：git tag v2.0.0 && git push origin v2.0.0
#  2) 手动触发（Actions 页面 Run workflow），此时使用配置文件里的版本号生成 vX.Y.Z 标签
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 全程使用仓库内置的 GITHUB_TOKEN，不需要用户额外提供个人 token。
# 前提：仓库 Settings -> Actions -> General -> Workflow permissions 设为 "Read and write permissions"
permissions:
  contents: write

# 同一 ref 只允许跑一条流水线，避免重复发布
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先校验标签版本与配置文件版本一致，避免发布出对不上的版本
  check-version:
    name: Check version consistency
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate version
        id: version
        run: |
          set -euo pipefail
          cfg_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg_version=$(node -p "require('./package.json').version")
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).packages[0].version))")

          echo "tauri.conf.json = $cfg_version"
          echo "package.json    = $pkg_version"
          echo "Cargo.toml      = $cargo_version"

          if [ "$cfg_version" != "$pkg_version" ] || [ "$cfg_version" != "$cargo_version" ]; then
            echo "::error::三处版本号不一致：tauri.conf.json=$cfg_version, package.json=$pkg_version, Cargo.toml=$cargo_version，请先统一版本号再发布。"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            tag_version="${tag#v}"
            if [ "$tag_version" != "$cfg_version" ]; then
              echo "::error::标签版本 ($tag_version) 与配置版本 ($cfg_version) 不一致。请使用 v${cfg_version} 形式的标签，或先把配置版本改为 $tag_version。"
              exit 1
            fi
          else
            tag="v${cfg_version}"
          fi

          echo "将发布标签：$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # 只构建 Windows x64 免安装版本（绿色版 zip + NSIS 安装包）
  build:
    name: Build Windows x64 (portable)
    needs: check-version
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      # 缓存 Rust 依赖与编译产物，缩短后续构建时间
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ env.TARGET }}

      - name: Install dependencies
        run: npm ci

      # 构建并创建草稿 Release（上传 NSIS 安装包）
      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.check-version.outputs.tag }}
          releaseName: 'zhiti2.0 v__VERSION__'
          releaseBody: |
            自动构建产物（未签名）：

            - Windows 免安装便携版（解压即用，直接运行其中的 .exe）：zhiti2.0_<version>_win_x64_portable.zip
            - Windows 安装包（NSIS）：zhiti2.0_<version>_x64-setup.exe

            > 免安装版依赖系统 WebView2 Runtime（Windows 10/11 一般已自带）。
          releaseDraft: true
          prerelease: false
          args: --target ${{ env.TARGET }} --bundles nsis

      # 把编译出来的主程序（绿色版）打包成 zip，追加上传到同一个 Release
      - name: Package portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $relDir = "src-tauri/target/${{ env.TARGET }}/release"
          # 取 release 目录中体积最大的 exe 作为主程序（绿色版可直接运行）
          $exe = Get-ChildItem "$relDir/*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { Write-Error "未在主程序目录找到可执行文件：$relDir"; exit 1 }
          $zipName = "$($exe.BaseName)_win_x64_portable.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zipName -Force
          Write-Host "免安装包：$zipName"
          echo "PORTABLE_ZIP=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload portable zip to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload "${{ needs.check-version.outputs.tag }}" "$env:PORTABLE_ZIP" --clobber
