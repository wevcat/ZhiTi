name: only win

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    name: Check version consistency
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate version
        id: version
        run: |
          set -euo pipefail
          
          # 👇 调试输出：看看 Actions 环境里 src-tauri 文件夹到底存不存在
          echo "Checking src-tauri directory..."
          ls -la src-tauri
          
          cfg_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg_version=$(node -p "require('./package.json').version")
          
          # 👇 修复点：使用 node -e 显式等待 stdin 读取完毕，避免打印 Socket 对象
          cargo_version=$(cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | node -e "
            let d = '';
            process.stdin.setEncoding('utf8');
            process.stdin.on('data', chunk => d += chunk);
            process.stdin.on('end', () => {
              try {
                const meta = JSON.parse(d);
                // 优先按包名查找，防止 workspace 多包时取错
                const pkg = meta.packages.find(p => p.name === 'zhiti2.0') || meta.packages[0];
                console.log(pkg.version);
              } catch (e) {
                process.stderr.write('JSON Parse Error: ' + e.message + '\nRaw: ' + d.substring(0, 200) + '\n');
                process.exit(1);
              }
            });
          ")

          echo "tauri.conf.json = $cfg_version"
          echo "package.json    = $pkg_version"
          echo "Cargo.toml      = $cargo_version"

          if [ "$cfg_version" != "$pkg_version" ] || [ "$cfg_version" != "$cargo_version" ]; then
            echo "::error::三处版本号不一致：tauri.conf.json=$cfg_version, package.json=$pkg_version, Cargo.toml=$cargo_version"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            tag_version="${tag#v}"
            if [ "$tag_version" != "$cfg_version" ]; then
              echo "::error::标签版本 ($tag_version) 与配置版本 ($cfg_version) 不一致。"
              exit 1
            fi
          else
            tag="v${cfg_version}"
          fi

          echo "将发布标签：$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build Windows Portable
    needs: check-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.check-version.outputs.tag }}
          releaseName: 'ZhiTi v__VERSION__'
          releaseBody: |
            自动构建产物：
            - `ZhiTi_win_x64_portable.zip`：免安装便携版（解压即用）
            - `*_x64-setup.exe`：NSIS 安装包
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc --bundles nsis

      - name: Package Portable Version
        shell: pwsh
        run: |
          # 从编译产物中提取主程序 exe 并打包成免安装 zip
          $releaseDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $exeFile = Get-ChildItem -Path $releaseDir -Filter "*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          
          if (-not $exeFile) {
            Write-Error "未找到编译生成的 exe 文件！"
            exit 1
          }
          
          $zipName = "ZhiTi_win_x64_portable.zip"
          Compress-Archive -Path $exeFile.FullName -DestinationPath $zipName -Force
          Write-Host "免安装包已生成: $zipName"

      - name: Upload Portable to Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.check-version.outputs.tag }}"
          $zipName = "ZhiTi_win_x64_portable.zip"
          gh release upload $tag $zipName --clobber
